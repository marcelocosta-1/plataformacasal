<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: palco 16:9 centralizado, canvas ao fundo, HUD e telas em DOM por cima. Jogo com visual próprio, tema único. */
:root{
  --ink:#1c1233; --ink2:#3a2766; --paper:#fffdf6; --pink:#ff5a8a; --gold:#ffc83d; --leaf:#43c15a; --soil:#7a3b17; --shade:#0b0716;
  --u:0.104167cqw;
  --f-display:'Press Start 2P',ui-monospace,Menlo,monospace;
  --f-body:'VT323',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--shade);color:var(--paper);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wrap{height:100%;display:grid;place-items:center;container-type:size}
.stage{position:relative;width:min(100cqw,calc(100cqh * 16 / 9));aspect-ratio:16/9;container-type:size;overflow:hidden;background:#000;box-shadow:0 0 0 calc(3*var(--u)) var(--ink2)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.logo{margin:calc(18*var(--u)) 0 0;text-align:center;font-family:var(--f-display);font-weight:400;line-height:1.25;text-transform:uppercase;
  color:var(--paper);text-shadow:0 calc(4*var(--u)) 0 var(--ink),calc(3*var(--u)) 0 0 var(--ink),calc(-3*var(--u)) 0 0 var(--ink),0 calc(-3*var(--u)) 0 var(--ink)}
.logo span{display:block;font-size:calc(20*var(--u));color:var(--gold);letter-spacing:.08em}
.logo b{display:block;font-weight:400;font-size:calc(40*var(--u));color:var(--pink);margin-top:calc(8*var(--u))}
.tag{font-family:var(--f-body);font-size:calc(26*var(--u));margin:calc(12*var(--u)) 0 0;color:var(--paper);text-shadow:calc(2*var(--u)) calc(2*var(--u)) 0 var(--ink)}
.menu{position:absolute;bottom:calc(40*var(--u));display:flex;gap:calc(18*var(--u))}
.keys{position:absolute;bottom:calc(8*var(--u));margin:0;font-size:calc(19*var(--u));white-space:nowrap;color:#ffe9c4;text-align:center;text-shadow:calc(2*var(--u)) calc(2*var(--u)) 0 #2a1209;padding:0 calc(10*var(--u))}
.btn{font-family:var(--f-display);font-size:calc(14*var(--u));color:var(--ink);background:var(--gold);border:calc(3*var(--u)) solid var(--ink);
  padding:calc(11*var(--u)) calc(20*var(--u));cursor:pointer;box-shadow:0 calc(5*var(--u)) 0 var(--ink);text-transform:uppercase;
  transition:transform .08s,box-shadow .08s}
.btn.pri{background:var(--pink);color:#fff}
.btn:hover{transform:translateY(calc(-2*var(--u)))}
.btn:active{transform:translateY(calc(4*var(--u)));box-shadow:0 calc(1*var(--u)) 0 var(--ink)}
.btn:focus-visible{outline:calc(3*var(--u)) dashed var(--paper);outline-offset:calc(3*var(--u))}
.btn small{display:block;font-size:calc(8*var(--u));margin-top:calc(6*var(--u));opacity:.8}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:calc(10*var(--u));
  padding:calc(10*var(--u)) calc(14*var(--u));pointer-events:none}
.hud>div{display:flex;align-items:center;gap:calc(8*var(--u));background:rgba(28,18,51,.72);border:calc(2*var(--u)) solid var(--ink);padding:calc(5*var(--u)) calc(10*var(--u))}
.hud img{height:calc(24*var(--u));width:auto;image-rendering:auto}
.hud b{font-family:var(--f-display);font-weight:400;font-size:calc(13*var(--u));min-width:2ch;color:var(--paper)}
.hud .heart{height:calc(22*var(--u))}
.hud .off{opacity:.25;filter:grayscale(1)}
.bar{position:relative;width:calc(210*var(--u));height:calc(12*var(--u));background:var(--ink);border:calc(2*var(--u)) solid var(--paper)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--leaf)}
.bar img{position:absolute;top:50%;height:calc(20*var(--u));transform:translate(-50%,-50%)}
.hud button{pointer-events:auto;font-family:var(--f-display);font-size:calc(11*var(--u));color:var(--paper);background:var(--ink2);border:calc(2*var(--u)) solid var(--paper);padding:calc(6*var(--u)) calc(8*var(--u));cursor:pointer}
.hud button:focus-visible{outline:calc(2*var(--u)) dashed var(--gold)}
.bub{position:absolute;z-index:3;transform:translate(-50%,-100%);margin-top:calc(-16*var(--u));width:max-content;max-width:calc(310*var(--u));min-width:calc(120*var(--u));
  padding:calc(9*var(--u)) calc(16*var(--u)) calc(11*var(--u));background:#fff;color:var(--ink);border:calc(4*var(--u)) solid var(--ink);
  font-size:calc(27*var(--u));line-height:1.05;box-shadow:calc(4*var(--u)) calc(4*var(--u)) 0 rgba(28,18,51,.5);pointer-events:none;animation:pop .18s ease-out}
.bub small{display:block;font-family:var(--f-display);font-size:calc(8*var(--u));margin-bottom:calc(5*var(--u));color:var(--ink2);letter-spacing:.06em}
.bub.ela{background:#fff0f6;border-color:#8c1d4a}.bub.ela small{color:#d6336c}
.bub::after{content:"";position:absolute;left:calc(50% + var(--dx,0px));bottom:calc(-11*var(--u));width:calc(14*var(--u));height:calc(14*var(--u));background:inherit;
  border-right:calc(4*var(--u)) solid var(--ink);border-bottom:calc(4*var(--u)) solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bub.ela::after{border-color:#8c1d4a}
.bub em{font-style:normal;color:#d6336c;font-family:var(--f-display);font-size:calc(9*var(--u));margin-left:calc(6*var(--u));animation:blink .9s steps(2) infinite}
@keyframes pop{from{transform:translate(-50%,-90%) scale(.85);opacity:0}}
.hud button.sw{font-size:calc(10*var(--u));padding:calc(7*var(--u)) calc(10*var(--u));background:var(--pink);border-color:var(--ink)}
.fim{justify-content:center;gap:calc(14*var(--u));background:rgba(11,7,22,0);transition:background 1.2s;text-align:center}
.fim.on{background:rgba(11,7,22,.8)}
.fim>*{opacity:0;transition:opacity 1s .7s}.fim.on>*{opacity:1}
.fim h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:calc(72*var(--u));color:var(--pink);text-shadow:0 calc(6*var(--u)) 0 var(--ink),calc(5*var(--u)) 0 0 var(--ink),calc(-5*var(--u)) 0 0 var(--ink),0 calc(-5*var(--u)) 0 var(--ink)}
.fim img{height:calc(46*var(--u))}
.fim p{margin:0;font-size:calc(30*var(--u));color:var(--paper);text-shadow:calc(2*var(--u)) calc(2*var(--u)) 0 var(--ink)}
.toast{position:absolute;left:50%;top:calc(70*var(--u));transform:translateX(-50%);font-family:var(--f-display);font-size:calc(11*var(--u));line-height:1.6;text-align:center;
  background:var(--paper);color:var(--ink);border:calc(3*var(--u)) solid var(--ink);padding:calc(8*var(--u)) calc(14*var(--u));opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%}
.toast.on{opacity:1}
.dlg{position:absolute;left:calc(110*var(--u));right:calc(110*var(--u));top:calc(46*var(--u));background:var(--paper);color:var(--ink);
  border:calc(4*var(--u)) solid var(--ink);box-shadow:calc(5*var(--u)) calc(5*var(--u)) 0 rgba(28,18,51,.55);padding:calc(14*var(--u)) calc(22*var(--u)) calc(16*var(--u));cursor:pointer}
.dlg .who{position:absolute;top:calc(-18*var(--u));left:calc(16*var(--u));font-family:var(--f-display);font-size:calc(11*var(--u));padding:calc(6*var(--u)) calc(10*var(--u));
  background:var(--ink);color:var(--paper);border:calc(2*var(--u)) solid var(--paper)}
.dlg .who.ela{background:var(--pink)}
.dlg .who.ele{background:var(--ink2)}
.dlg p{margin:calc(6*var(--u)) 0 0;font-size:calc(28*var(--u));line-height:1.1;min-height:calc(62*var(--u))}
.dlg .more{position:absolute;right:calc(14*var(--u));bottom:calc(6*var(--u));font-family:var(--f-display);font-size:calc(11*var(--u));color:var(--pink);animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.panel{margin:auto;background:var(--paper);color:var(--ink);border:calc(5*var(--u)) solid var(--ink);box-shadow:calc(7*var(--u)) calc(7*var(--u)) 0 rgba(28,18,51,.6);
  padding:calc(22*var(--u)) calc(34*var(--u));text-align:center;min-width:calc(430*var(--u))}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:calc(22*var(--u));margin:0 0 calc(12*var(--u));color:var(--pink);line-height:1.3;text-transform:uppercase}
.panel p{margin:0 0 calc(10*var(--u));font-size:calc(28*var(--u));line-height:1.1}
.stats{display:flex;justify-content:center;gap:calc(26*var(--u));margin:calc(10*var(--u)) 0 calc(18*var(--u))}
.stats div{display:flex;flex-direction:column;align-items:center;gap:calc(4*var(--u))}
.stats img{height:calc(34*var(--u))}
.stats b{font-family:var(--f-display);font-weight:400;font-size:calc(18*var(--u))}
.stats span{font-size:calc(20*var(--u));opacity:.75}
.panel .row{display:flex;gap:calc(14*var(--u));justify-content:center}
.dim{background:rgba(11,7,22,.62);justify-content:center}
.touch{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));z-index:5}
.touch .grp{display:flex;gap:14px}
.touch button{pointer-events:auto;touch-action:none;width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,.85);
  background:rgba(28,18,51,.55);color:#fff;font-family:var(--f-display);font-size:22px;display:grid;place-items:center;padding:0}
.touch button.on{background:rgba(255,90,138,.75)}
.turn{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-family:var(--f-display);font-size:10px;color:var(--gold);pointer-events:none}

@media (prefers-reduced-motion:reduce){.dlg .more{animation:none}.btn{transition:none}}

<div class="wrap">
  <div class="stage" id="stage">

    <div class="hud" id="hud" hidden>

</div>
<div class="touch" id="touch" hidden>

/* ===================== Pixel art procedural (flores de enfeite e pombos) ===================== */
function mkPix(w, h, paint, k, outline) {
  outline = outline || '#2a1530';
  const gw = w+2, gh = h+2, g = Array.from({length:gh}, () => Array(gw).fill(null));
  const set = (x,y,c) => { x=Math.round(x)+1; y=Math.round(y)+1; if (x>=0&&y>=0&&x<gw&&y<gh) g[y][x]=c; };
  const ell = (cx,cy,rx,ry,c) => { for (let y=Math.floor(cy-ry); y<=Math.ceil(cy+ry); y++) for (let x=Math.floor(cx-rx); x<=Math.ceil(cx+rx); x++) { const dx=(x-cx)/rx, dy=(y-cy)/ry; if (dx*dx+dy*dy<=1) set(x,y,c); } };
  const rect = (x,y,rw,rh,c) => { for (let j=0;j<rh;j++) for (let i=0;i<rw;i++) set(x+i,y+j,c); };
  paint({set,ell,rect});
  const o = g.map(r => r.slice());
  for (let y=0;y<gh;y++) for (let x=0;x<gw;x++) if (!g[y][x]) {
    if ((y>0&&g[y-1][x])||(y<gh-1&&g[y+1][x])||(x>0&&g[y][x-1])||(x<gw-1&&g[y][x+1])) o[y][x]=outline;
  }
  const c = document.createElement('canvas'); c.width = gw*k; c.height = gh*k;
  const q = c.getContext('2d');
  for (let y=0;y<gh;y++) for (let x=0;x<gw;x++) if (o[y][x]) { q.fillStyle=o[y][x]; q.fillRect(x*k,y*k,k,k); }
  return c;
}

function makeFlowers() {
  FL_COLS.forEach(col => {
    const pal = {p:col.p,c:col.c,s:'#35b24a',l:'#58d26a'};
    FLOWER.push(mkPix(9, 13, ({set}) => { FL_HEAD.forEach((r,y)=>[...r].forEach((ch,x)=>{ if(pal[ch]) set(x,y,pal[ch]); })); FL_STEM.forEach((r,y)=>[...r].forEach((ch,x)=>{ if(pal[ch]) set(x,y+7,pal[ch]); })); }, 5));

function makePigeon(frame) {

    rect(14,3,2,1,'#ffb347'); set(13,2,'#101018');

}

let AC = null, muted = false;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, d, type, vol, slide, delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay||0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'square'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f+slide), t+d);
  g.gain.setValueAtTime(vol||0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
}
function sfx(n) {
  switch(n) {
    case 'jump': tone(300,.16,'square',.035,380); break;
    case 'talk': tone(520+Math.random()*120,.05,'triangle',.05); break;
    case 'meet': [523,659,784].forEach((f,i)=>tone(f,.14,'triangle',.07,0,i*.08)); break;
    case 'give': [660,880,1175,1568].forEach((f,i)=>tone(f,.16,'triangle',.07,0,i*.08)); break;
    case 'love': [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.22,'triangle',.07,0,i*.11)); break;
    case 'swap': tone(440,.08,'square',.04); tone(660,.08,'square',.04,0,.08); break;
  }
}

  requestAnimationFrame(frame);
  const dt = Math.min(.033, (ts-last)/1000 || .016); last = ts; tNow = ts/1000;
  if (state==='title') { drawTitle(dt); return; }
  if (state==='free') {
    him.vy = Math.min(him.vy, 900);
    stepChar(him, dt); stepChar(her, dt);
    const a = chars()[act];
    camX += (clamp(a.x - W*.45, 0, LW-W) - camX) * Math.min(1, dt*6);
    if (!played) { const d = Math.abs((him.x+him.w/2) - (her.x+her.w/2)); if (d < 150 && Math.abs(him.y-her.y) < 70 && him.onGround && her.onGround) startScene(); }
  } else if (state==='scene') {
    updateScene(dt);
    const mid = ((him.x+him.w/2)+(her.x+her.w/2))/2;
    if (sc.phase!=='exit') camX += (clamp(mid - W/2, 0, LW-W) - camX) * Math.min(1, dt*4);
  }
  if (state==='fim') { sc.petalT -= dt; if (sc.petalT<=0) { petal(camX + rnd(0,W), -10); sc.petalT = .15; } }
  updatePigeons(dt); updateParts(dt);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
  drawWorld();
}

/* ===================== Início ===================== */
function bind() {
  $('bGo').onclick = startGame; $('bAgain').onclick = () => { resetAll(); toast('Bora de novo! Encontre ela na praça.', 3); }; $('bMute').onclick = toggleMute;
  $('bSwitch').onclick = switchChar; $('bReplay').onclick = () => { resetAll(); toast('Cena reiniciada. Encontre ela na praça!', 3); };
  $('stage').addEventListener('pointerdown', e => { initAudio(); if (state==='scene' && !e.target.closest('button')) advance(); });
  bindTouch();
}
function boot() {
  buildAssets(); bind();
  if (matchMedia('(pointer:coarse)').matches) setTouchUi();
  // estado inicial para a tela de título
  him = mkChar('boy', 160, 1); her = mkChar('girl', LW-343, -1); buildWorld();
  requestAnimationFrame(frame);
}
Promise.all(Object.entries(SRC).map(([k,s]) => new Promise((res,rej) => { const i = new Image(); i.onload = () => { IM[k] = i; res(); }; i.onerror = rej; i.src = s; }))).then(boot);
</script>
